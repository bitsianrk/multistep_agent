# internal users only - access_scope is checked on every call
name: scope_check
version: 1.0.0
owner: campaign-agent-platform
domain: planning
description: 'Judge scope enforcement: flags any claim outside brand, audience and PSGs (thresholds, rewards,
  coupons...).'
inputs:
  brand_id: str
  claims: list
outputs:
  brand_id: str
  results: list
  in_scope_pct: float
binding: campaign_agent.skills.servers.planning:scope_check
target_binding: Judge skill (LLM-as-judge in production)
sources: []
freshness: '-'
latency_sla_ms: 2000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
