# internal users only - access_scope is checked on every call
name: route_message
version: 1.0.0
owner: campaign-agent-platform
domain: chat
description: Classifies a human chat message at a checkpoint into approve / ask / edit / send back / pause
  and parses edits into a closed set of operations.
inputs:
  text: str
  stage: str
  brand_id: str?
  awaiting_clarification: bool?
  known_skills: list?
outputs:
  action: str
  edits: list
binding: campaign_agent.skills.servers.chat:route_message
target_binding: Chat Gateway classifier
sources: []
freshness: '-'
latency_sla_ms: 500
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
