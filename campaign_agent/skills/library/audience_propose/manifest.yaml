# internal users only - access_scope is checked on every call
name: audience_propose
version: 1.0.0
owner: campaign-agent-platform
domain: planning
description: Scores candidate cohorts for the objective using sizes and past Multi-Step response, and
  proposes which to include with rationale.
inputs:
  brand_id: str
  objective: str
  cohort_sizes: dict
  response: dict
  cohort_bias: dict?
outputs:
  brand_id: str
  cohorts: list
  total_included: int
binding: campaign_agent.skills.servers.planning:audience_propose
target_binding: Azure ML audience model endpoint
sources:
- feat_customer_brand_6w
- campaign_mart
freshness: T-1
latency_sla_ms: 2000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
