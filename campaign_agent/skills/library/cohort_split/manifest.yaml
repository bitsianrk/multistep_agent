# internal users only - access_scope is checked on every call
name: cohort_split
version: 1.0.0
owner: proposition-audience-ds
domain: transactions
description: Block 3. % shoppers and % sales by loyalty tier (lapsed / light / medium / heavy), lifestage,
  value segment and Clubcard Plus.
inputs:
  brand_id: str
outputs:
  brand_id: str
  loyalty_tier: list
  lifestage: list
  value_segment: list
  clubcard_plus: list
binding: campaign_agent.skills.servers.transactions:cohort_split
target_binding: 'Databricks SQL: feat_customer_brand_6w joined to the weekly segmentation snapshot'
sources:
- feat_customer_brand_6w
- segmentation_weekly
freshness: T-1 (segments weekly)
latency_sla_ms: 3000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
