# internal users only - access_scope is checked on every call
name: reconcile_metrics
version: 1.0.0
owner: campaign-agent-platform
domain: planning
description: 'Critic self-verification: cohort shares sum to 100%, shoppers x SPC ~= sales, frequency
  x spend per trip = SPC, Kantar period matches the window.'
inputs:
  brand_id: str
  pack: dict
outputs:
  brand_id: str
  passed: bool
  checks: list
binding: campaign_agent.skills.servers.planning:reconcile_metrics
target_binding: Critic skill
sources: []
freshness: '-'
latency_sla_ms: 2000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
