# internal users only - access_scope is checked on every call
name: ner_extract
version: 1.0.0
owner: product-knowledge
domain: taxonomy
description: Extracts brand and category mentions, objective and campaign window from free chat text.
inputs:
  text: str
outputs:
  brand_mentions: list
  category_mentions: list
  objective: str?
  window: dict
binding: campaign_agent.skills.servers.taxonomy:ner_extract
target_binding: NER model + Azure AI Search vector index over the taxonomy
sources:
- taxonomy
freshness: On range change
latency_sla_ms: 1000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
