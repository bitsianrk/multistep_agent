# internal users only - access_scope is checked on every call
name: margin_after_funding
version: 1.0.0
owner: commercial-analytics
domain: commercial
description: Block 8. Margin after supplier funding per PSG and sales-weighted for the brand; flags PSGs
  below the margin floor.
inputs:
  brand_id: str
outputs:
  brand_id: str
  brand_margin_after_funding_pct: float
  psgs: list
binding: campaign_agent.skills.servers.commercial:margin_after_funding
target_binding: Commercial mart margin view + shelf price API
sources:
- commercial_mart
- price_api
freshness: Daily
latency_sla_ms: 2000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
