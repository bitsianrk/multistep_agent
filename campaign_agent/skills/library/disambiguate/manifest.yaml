# internal users only - access_scope is checked on every call
name: disambiguate
version: 1.0.0
owner: product-knowledge
domain: taxonomy
description: Maps a human's clarification reply onto exactly one of the candidate brands.
inputs:
  text: str
  candidates: list
outputs:
  brand_id: str?
  confidence: float
binding: campaign_agent.skills.servers.taxonomy:disambiguate
target_binding: Taxonomy graph
sources:
- taxonomy
freshness: On range change
latency_sla_ms: 1000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
