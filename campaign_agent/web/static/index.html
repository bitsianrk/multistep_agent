<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Step Campaign Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300539F'/><path d='M8 22l5-6 4 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Multi-Step Campaign Planner</h1>
        <p class="sub">Brand · audience · PSGs → Agreed Brief</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="mode" class="badge" title="LRM mode">…</span>
      <span id="user" class="muted small"></span>
      <select id="runs" aria-label="Open a previous run"><option value="">Runs</option></select>
      <button id="new-run" class="btn ghost">New run</button>
    </div>
  </header>

  <nav id="stepper" class="stepper" aria-label="Stages"></nav>

  <main class="layout">
    <section class="chat" aria-label="Chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="suggestions" class="suggestions"></div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Describe the campaign: brand, objective, window…"></textarea>
        <button id="send" class="btn primary" type="submit">Send</button>
      </form>
    </section>

    <aside class="panel" aria-label="Run details">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tab-body" class="tab-body"></div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
