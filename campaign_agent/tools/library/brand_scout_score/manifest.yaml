# internal users only - access_scope is checked on every call
name: brand_scout_score
version: 1.0.0
owner: market-insight-ds
domain: market
description: Ranks other brands in the requested brand's category on seasonal fit, market momentum, sentiment,
  headroom and margin for the campaign window. Use when deciding whether to keep or switch brand.
inputs:
  brand_id: str
  window_start: date
  window_weeks: int
  switch_bias: float?
outputs:
  brand_id: str
  requested: dict
  alternatives: list
binding: campaign_agent.tools.servers.market:brand_scout_score
target_binding: sql/brand_scout.sql + kantar_share
sources:
- feat_brand_week
- kantar_cache
- sentiment_daily
- commercial_mart
freshness: T-1 (Kantar per release period)
latency_sla_ms: 8000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
