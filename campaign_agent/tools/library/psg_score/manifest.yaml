# internal users only - access_scope is checked on every call
name: psg_score
version: 1.0.0
owner: proposition-audience-ds
domain: transactions
description: Block 5. Reach (% brand shoppers buying the PSG) and momentum (6 wks vs prior 6 wks and YoY)
  per PSG, combined into a hero score.
inputs:
  brand_id: str
  hero_bias: dict?
outputs:
  brand_id: str
  psgs: list
binding: campaign_agent.tools.servers.transactions:psg_score
target_binding: Databricks SQL over feat_psg_week + feat_customer_brand_6w
sources:
- feat_customer_brand_6w
- feat_psg_week
freshness: T-1
latency_sla_ms: 3000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
