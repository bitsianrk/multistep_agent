# internal users only - access_scope is checked on every call
name: kantar_share
version: 1.0.0
owner: market-insight-ds
domain: market
description: Block 7. Kantar / Worldpanel value share for the latest release period, 3-period trend, and
  trend relative to the category.
inputs:
  brand_id: str
outputs:
  brand_id: str
  period: str
  period_end: str
  licence_scope: str
  value_share: float
  value_share_trend_pts: float
binding: campaign_agent.tools.servers.market:kantar_share
target_binding: kantar_* MCP tool set over the licensed Worldpanel feed (cached per period)
sources:
- kantar_cache
freshness: Per release period
latency_sla_ms: 8000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
