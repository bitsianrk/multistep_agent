# internal users only - access_scope is checked on every call
name: brand_spc
version: 1.0.0
owner: proposition-audience-ds
domain: transactions
description: Block 2. Spend per customer = brand sales / brand shoppers = frequency x spend per trip;
  average basket value of brand-containing trips. Optional cohort filter.
inputs:
  brand_id: str
  cohort: str?
outputs:
  brand_id: str
  cohort: str
  suppressed: bool
binding: campaign_agent.tools.servers.transactions:brand_spc
target_binding: Databricks SQL over feat_customer_brand_6w
sources:
- feat_customer_brand_6w
freshness: T-1
latency_sla_ms: 3000
access_scope:
- campaign_manager_role
mechanics_enabled:
- multistep_spend
